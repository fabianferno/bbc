# Build-script approval. pnpm 11 reads `allowBuilds` (pnpm 10 used
# onlyBuiltDependencies / ignoredBuiltDependencies); the installed pnpm is 11.

allowBuilds:
  # Built — this app needs them compiled.
  sharp: true             # next/image
  unrs-resolver: true     # eslint
  bigint-buffer: true     # @solana/web3.js
  protobufjs: true

  # Not built. Hardware-wallet, EVM and native-socket transitives pulled in by
  # @privy-io/react-auth's multi-chain support. This build is Solana-only and
  # signs through Privy, so none of it is reachable — compiling them would add
  # native toolchain requirements the deploy does not have. Listed explicitly so
  # pnpm does not treat them as unreviewed.
  '@reown/appkit': false      # WalletConnect UI; we use Privy's own modal
  '@stellar/stellar-sdk': false
  blake-hash: false
  bufferutil: false
  keccak: false               # EVM hashing; Solana-only build
  tiny-secp256k1: false
  usb: false
  utf-8-validate: false
