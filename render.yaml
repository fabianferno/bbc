# Durable deploy for the openmind API (Render). `render.yaml` blueprint.
# Set the secret env vars in the Render dashboard (marked sync:false).
services:
  - type: web
    name: openmind-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AGENT_MODE
        value: paper
      - key: SOLANA_ENABLED
        value: "true"
      - key: SOLANA_CLUSTER
        value: devnet
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: BEDROCK_MODEL_ID
        value: apac.amazon.nova-lite-v1:0
      - key: GRAPHRAG_ENABLED
        value: "true"
      - key: SEARCH_PROVIDER
        value: exa
      # --- secrets: set these in the dashboard ---
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: MANIFOLD_API_KEY
        sync: false
      - key: SOLANA_KEYPAIR_PATH
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
